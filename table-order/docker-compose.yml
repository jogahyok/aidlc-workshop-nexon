version: "3.8"

services:
  auth-service:
    build: ./services/auth-service
    ports:
      - "8001:8000"
    env_file:
      - ./services/auth-service/.env
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  store-service:
    build: ./services/store-service
    ports:
      - "8002:8000"
    env_file:
      - ./services/store-service/.env
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
